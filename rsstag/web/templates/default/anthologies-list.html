<!DOCTYPE html>
<html>

<head>
    <title>Anthologies</title>
    {% include "head-data.html" %}
</head>

<body>
    {% from 'site-header.html' import site_header with context %}
    {{ site_header(active='') }}

    <main class="page anth-list-page">
        <header class="anth-list-page__head">
            <h1>Anthologies</h1>
            <p class="anth-muted">Group the snippets about a tag into themes and subtopics, then read them cluster by cluster.</p>
        </header>

        <form id="anthology-create-form" class="anth-create-form">
            <input type="hidden" name="seed_type" value="tag" />
            <div class="anth-create-form__field anth-suggest-wrap">
                <label for="anthology-seed-value"><span>Tag</span></label>
                <input id="anthology-seed-value" name="seed_value" type="text"
                    value="{{ initial_seed_value|e }}" placeholder="playstation 5" required autocomplete="off" />
                <div id="anthology-seed-suggestions" class="anth-suggest" hidden></div>
            </div>
            <label class="anth-create-form__field">
                <span>Corpus</span>
                <select id="anthology-feed-id" name="feed_id">
                    <option value="">All feeds</option>
                    {% for feed in feeds %}
                    <option value="{{ feed['feed_id']|e }}" {% if feed['feed_id'] == selected_feed_id %}selected{% endif %}>{{ feed['title']|e }}</option>
                    {% endfor %}
                </select>
            </label>
            <button type="submit" class="anth-btn anth-btn--primary">Build anthology</button>
            <span id="anthology-create-status" class="anth-muted" role="status"></span>
        </form>

        <section id="anthology-list" class="anth-list" aria-live="polite"></section>
    </main>

    <script id="anthologies-data" type="application/json">{{ anthologies_json }}</script>
    <script type="module">
        import { initAnthologiesList } from '/static/js/anthologies-list.js';
        initAnthologiesList();
    </script>
</body>

</html>
