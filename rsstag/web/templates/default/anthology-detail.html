<!DOCTYPE html>
<html>

<head>
    <title>{{ anthology['seed_value']|e }} | Anthology</title>
    {% include "head-data.html" %}
</head>

<body>
    {% from 'site-header.html' import site_header with context %}
    {{ site_header(active='', page_scope='Anthology', page_title=anthology['seed_value']) }}

    <main class="page anth-detail" id="anthology-app" data-anthology-id="{{ anthology['id']|e }}">
        <nav class="anth-breadcrumbs"><a href="/anthologies">Anthologies</a> / <span>{{ anthology['seed_value']|e }}</span></nav>
        <header id="anth-head" class="anth-head"></header>
        <div class="anth-explorer">
            <nav id="anth-tree" class="anth-pane anth-pane--tree" aria-label="Themes and clusters"></nav>
            <section id="anth-main" class="anth-pane anth-pane--main" aria-live="polite"></section>
            <aside id="anth-stats" class="anth-pane anth-pane--stats" aria-label="Cluster details"></aside>
        </div>
        <p id="anth-note" class="anth-note" role="status"></p>
    </main>

    <script id="anthology-detail-data" type="application/json">{{ anthology_json }}</script>
    <script type="module">
        import { initAnthologyDetail } from '/static/js/anthology-detail.js';
        initAnthologyDetail();
    </script>
</body>

</html>
